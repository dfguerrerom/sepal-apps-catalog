# Pre-commit hooks for sepal-apps-catalog.
# Mirrors the JSON checks in .github/workflows/validate.yml so problems are
# caught locally before they fail CI. The docker-commit reachability check is
# only run in CI (it needs network and a GitHub token).
#
# One-time setup after cloning:
#   pip install pre-commit  # or pipx install pre-commit
#   pre-commit install
#   npm install --prefix .github/workflows/scripts
repos:
  - repo: local
    hooks:
      - id: catalog-format
        name: Auto-format catalog JSON to canonical form
        entry: node .github/workflows/scripts/fix-format.js
        language: system
        files: ^apps\.(test|prod|dev|schema)\.json$
        pass_filenames: true

      - id: catalog-schema
        name: Validate catalogs against apps.schema.json
        entry: node .github/workflows/scripts/validate.js apps.schema.json apps.test.json apps.prod.json apps.dev.json
        language: system
        files: ^apps\.(test|prod|dev|schema)\.json$
        pass_filenames: false

      - id: catalog-dev-projection
        name: Check apps.dev.json matches the dev-apps.txt projection
        entry: node .github/workflows/scripts/sync-dev.js --check
        language: system
        files: ^apps\.dev\.json$
        pass_filenames: false

      - id: catalog-dev-projection-inputs
        name: Validate apps.dev.json projection inputs
        entry: node .github/workflows/scripts/sync-dev.js --validate
        language: system
        files: ^(apps\.test\.json|dev-apps\.txt|\.github/workflows/scripts/sync-dev\.js)$
        pass_filenames: false

      - id: catalog-docker-rules
        name: Check docker app port uniqueness and path = /api/app-launcher/<id>
        entry: node .github/workflows/scripts/check-docker-rules.js apps.test.json apps.prod.json apps.dev.json
        language: system
        files: ^apps\.(test|prod|dev)\.json$
        pass_filenames: false
