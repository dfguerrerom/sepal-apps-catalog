name: Validate catalog

on:
  pull_request:
    paths:
      - 'apps.test.json'
      - 'apps.prod.json'
      - 'apps.schema.json'
      - '.github/workflows/validate.yml'
      - '.github/workflows/scripts/**'
  push:
    branches: [main]
    paths:
      - 'apps.test.json'
      - 'apps.prod.json'
      - 'apps.schema.json'
      - '.github/workflows/validate.yml'
      - '.github/workflows/scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validator deps
        run: npm ci --silent --prefix .github/workflows/scripts

      - name: Run script unit tests
        run: npm test --prefix .github/workflows/scripts

      - name: Check canonical JSON formatting
        run: node .github/workflows/scripts/check-format.js apps.test.json apps.prod.json apps.schema.json

      - name: Validate schema
        run: node .github/workflows/scripts/validate.js apps.schema.json apps.test.json apps.prod.json

      - name: Verify each docker commit exists in its repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for file in apps.test.json apps.prod.json; do
            jq -c '.apps[] | select(.endpoint == "docker")' "$file" | while read -r app; do
              repo=$(echo "$app" | jq -r '.repository')
              commit=$(echo "$app" | jq -r '.commit')
              label=$(echo "$app" | jq -r '.label')
              echo "Checking $label: $repo @ $commit"
              ownerRepo=$(echo "$repo" | sed -E 's#^https://github\.com/##; s#\.git$##')
              status=$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$ownerRepo/commits/$commit")
              if [ "$status" != "200" ]; then
                echo "::error file=$file::$label: commit $commit not found in $repo (HTTP $status)"
                exit 1
              fi
            done
          done
