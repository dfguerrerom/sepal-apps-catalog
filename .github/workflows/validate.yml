name: Validate catalog

on:
  pull_request:
    paths:
      - 'apps.test.json'
      - 'apps.prod.json'
      - 'apps.dev.json'
      - 'apps.schema.json'
      - '.github/workflows/validate.yml'
      - '.github/workflows/scripts/**'
  push:
    branches: [main]
    paths:
      - 'apps.test.json'
      - 'apps.prod.json'
      - 'apps.dev.json'
      - 'apps.schema.json'
      - '.github/workflows/validate.yml'
      - '.github/workflows/scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validator deps
        run: npm ci --silent --prefix .github/workflows/scripts

      - name: Run script unit tests
        run: npm test --prefix .github/workflows/scripts

      - name: Check canonical JSON formatting
        run: node .github/workflows/scripts/check-format.js apps.test.json apps.prod.json apps.dev.json apps.schema.json

      - name: Validate schema
        run: node .github/workflows/scripts/validate.js apps.schema.json apps.test.json apps.prod.json apps.dev.json

      - name: Check docker rules (port uniqueness, path = /api/app-launcher/<id>)
        run: node .github/workflows/scripts/check-docker-rules.js apps.test.json apps.prod.json apps.dev.json

      - name: Verify each docker commit is reachable from its declared branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for file in apps.test.json apps.prod.json apps.dev.json; do
            jq -c '.apps[] | select(.endpoint == "docker")' "$file" | while read -r app; do
              repo=$(echo "$app" | jq -r '.repository')
              commit=$(echo "$app" | jq -r '.commit')
              branch=$(echo "$app" | jq -r '.branch')
              label=$(echo "$app" | jq -r '.label')
              ownerRepo=$(echo "$repo" | sed -E 's#^https://github\.com/##; s#\.git$##')
              if [ "$branch" = "null" ] || [ -z "$branch" ]; then
                echo "::error file=$file::$label: docker entry is missing a 'branch' (cannot verify commit $commit)"
                exit 1
              fi
              echo "Checking $label: commit $commit reachable from branch $branch in $repo"
              # Compare branch...commit. The app-launcher does `git fetch origin <branch>`
              # then `git checkout --detach <commit>`, so the commit must be an ancestor of
              # (or equal to) the branch tip. The GitHub compare API reports this as
              # ahead_by == 0 (status "behind" or "identical"). A non-200 means the branch
              # or commit does not exist; ahead_by > 0 means the commit is not on the branch.
              response=$(curl -sS -w '\n%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$ownerRepo/compare/$branch...$commit")
              status=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')
              if [ "$status" != "200" ]; then
                echo "::error file=$file::$label: cannot compare $branch...$commit in $repo (HTTP $status) — branch or commit may not exist"
                exit 1
              fi
              aheadBy=$(echo "$body" | jq -r '.ahead_by')
              if [ "$aheadBy" != "0" ]; then
                echo "::error file=$file::$label: commit $commit is not reachable from branch $branch in $repo (ahead_by=$aheadBy). Update 'branch' or 'commit' so the pinned commit is an ancestor of the branch."
                exit 1
              fi
            done
          done
