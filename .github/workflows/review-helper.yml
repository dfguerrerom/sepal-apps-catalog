name: Review helper

on:
  # Not pull_request: on PRs from forks that gets a read-only token and cannot post the comment.
  pull_request_target:
    paths:
      - 'apps.test.json'
      - 'apps.prod.json'
      - 'apps.dev.json'
      - '.github/workflows/review-helper.yml'
      - '.github/workflows/scripts/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      # This job holds a write token, so it only ever runs this repository's own scripts: the
      # checkout stays on the base branch and the PR's catalogs are read below as plain data.
      # A PR's edits to the scripts therefore take effect here only once merged.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read base and PR catalogs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          # The merge base, not the base tip: what the PR changes, even when main has moved on.
          base=$(git merge-base "origin/$BASE_REF" pr/head)
          mkdir -p /tmp/base /tmp/head
          for f in apps.test.json apps.prod.json apps.dev.json; do
            git show "$base:$f" > "/tmp/base/$f" 2>/dev/null || echo '{"apps":[]}' > "/tmp/base/$f"
            git show "pr/head:$f" > "/tmp/head/$f" 2>/dev/null || echo '{"apps":[]}' > "/tmp/head/$f"
          done

      - name: Diff each catalog
        id: diff
        run: |
          node .github/workflows/scripts/diff-apps.js /tmp/base/apps.test.json /tmp/head/apps.test.json > /tmp/diff.test.json
          node .github/workflows/scripts/diff-apps.js /tmp/base/apps.prod.json /tmp/head/apps.prod.json > /tmp/diff.prod.json
          node .github/workflows/scripts/diff-apps.js /tmp/base/apps.dev.json /tmp/head/apps.dev.json > /tmp/diff.dev.json

      - name: Generate risk reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## test.sepal.io changes"
            echo
            cat /tmp/diff.test.json | node .github/workflows/scripts/risk-flags.js
            echo
            echo "## sepal.io changes"
            echo
            cat /tmp/diff.prod.json | node .github/workflows/scripts/risk-flags.js
            echo
            echo "## dev catalog changes"
            echo
            cat /tmp/diff.dev.json | node .github/workflows/scripts/risk-flags.js
          } > /tmp/comment.md

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const body = '<!-- sepal-apps-review-helper -->\n' + fs.readFileSync('/tmp/comment.md', 'utf8')
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })
            const existing = comments.find(c => c.body && c.body.startsWith('<!-- sepal-apps-review-helper -->'))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              })
            }
