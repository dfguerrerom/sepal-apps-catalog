name: Review helper

on:
  pull_request:
    paths:
      - 'apps.test.json'
      - 'apps.prod.json'
      - 'apps.dev.json'
      - '.github/workflows/review-helper.yml'
      - '.github/workflows/scripts/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute base versions
        run: |
          mkdir -p /tmp/base
          git show "origin/${{ github.base_ref }}:apps.test.json" > /tmp/base/apps.test.json 2>/dev/null || echo '{"apps":[]}' > /tmp/base/apps.test.json
          git show "origin/${{ github.base_ref }}:apps.prod.json" > /tmp/base/apps.prod.json 2>/dev/null || echo '{"apps":[]}' > /tmp/base/apps.prod.json
          git show "origin/${{ github.base_ref }}:apps.dev.json" > /tmp/base/apps.dev.json 2>/dev/null || echo '{"apps":[]}' > /tmp/base/apps.dev.json

      - name: Diff each catalog
        id: diff
        run: |
          node .github/workflows/scripts/diff-apps.js /tmp/base/apps.test.json apps.test.json > /tmp/diff.test.json
          node .github/workflows/scripts/diff-apps.js /tmp/base/apps.prod.json apps.prod.json > /tmp/diff.prod.json
          node .github/workflows/scripts/diff-apps.js /tmp/base/apps.dev.json apps.dev.json > /tmp/diff.dev.json

      - name: Generate risk reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## test.sepal.io changes"
            echo
            cat /tmp/diff.test.json | node .github/workflows/scripts/risk-flags.js
            echo
            echo "## sepal.io changes"
            echo
            cat /tmp/diff.prod.json | node .github/workflows/scripts/risk-flags.js
            echo
            echo "## dev catalog changes"
            echo
            cat /tmp/diff.dev.json | node .github/workflows/scripts/risk-flags.js
          } > /tmp/comment.md

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const body = '<!-- sepal-apps-review-helper -->\n' + fs.readFileSync('/tmp/comment.md', 'utf8')
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            })
            const existing = comments.find(c => c.body && c.body.startsWith('<!-- sepal-apps-review-helper -->'))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              })
            }
